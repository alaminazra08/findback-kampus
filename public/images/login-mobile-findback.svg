<svg xmlns="http://www.w3.org/2000/svg" width="460" height="340" viewBox="0 0 460 340" role="img" aria-label="Ilustrasi mahasiswa pria mencari barang menggunakan laptop">
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff8fb"/><stop offset="1" stop-color="#f4dbe4"/></linearGradient>
 <linearGradient id="coat" x1="0" x2="1"><stop stop-color="#6e0a2a"/><stop offset="1" stop-color="#a71c4b"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6b2640" flood-opacity=".12"/></filter>
</defs>
<style>
 .float{animation:float 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
 .float2{animation:float 5s ease-in-out 1s infinite alternate;transform-box:fill-box;transform-origin:center}
 .pulse{animation:pulse 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
 @keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
 @keyframes pulse{50%{opacity:.6;transform:scale(1.045)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- soft ornamental halo -->
<ellipse cx="235" cy="307" rx="190" ry="18" fill="#e4b9c9" opacity=".3"/>
<circle cx="228" cy="155" r="129" fill="url(#bg)"/>
<circle cx="110" cy="85" r="7" fill="#dab2c2" opacity=".8"/>
<circle cx="387" cy="124" r="5" fill="#a22550" opacity=".55"/>
<!-- website window -->
<g class="float2" filter="url(#shadow)">
<rect x="208" y="51" width="185" height="148" rx="14" fill="#fff" stroke="#ead3dc" stroke-width="1.5"/>
<path d="M208 65q0-14 14-14h157q14 0 14 14v17H208z" fill="#f7e7ed"/>
<circle cx="223" cy="66" r="4" fill="#a32e54"/><circle cx="237" cy="66" r="4" fill="#c78ba2"/><circle cx="251" cy="66" r="4" fill="#e5c9d4"/>
<rect x="225" y="103" width="115" height="14" rx="7" fill="#f7eef1"/>
<rect x="225" y="128" width="143" height="14" rx="7" fill="#f7eef1"/>
<rect x="225" y="153" width="105" height="25" rx="9" fill="#851034"/>
<rect x="346" y="96" width="32" height="32" rx="9" fill="#fae5ed"/>
<circle cx="359" cy="109" r="7" fill="none" stroke="#90103a" stroke-width="2.8"/>
<path d="m364 114 6 6" stroke="#90103a" stroke-width="2.8" stroke-linecap="round"/>
</g>
<!-- person: modest long sleeves and long trousers -->
<g>
<path d="M77 293h119" stroke="#8e6675" stroke-width="2" stroke-linecap="round"/>
<rect x="77" y="224" width="90" height="67" rx="18" fill="#e2b4c4"/>
<rect x="91" y="283" width="9" height="26" rx="3" fill="#725160"/>
<rect x="152" y="283" width="9" height="26" rx="3" fill="#725160"/>
<!-- long trousers -->
<path d="M110 226q36-13 60 7l-4 52h-24l-7-36-13 35H98z" fill="#263343"/>
<path d="M98 280h26l-3 15q-13 8-31 2zM142 281h25l6 14q-14 8-32-1z" fill="#374554"/>
<!-- long-sleeve maroon shirt -->
<path d="M107 161q39-22 62 9l10 61q-34 15-83-4l-1-40q-9 25-20 34l-13-9q8-23 15-40 9-17 30-11" fill="url(#coat)"/>
<path d="M161 177q15 28 17 47l-15 5-17-35" fill="#7e1235"/>
<!-- neck -->
<path d="M115 143v22q11 11 22 0v-22" fill="#b47c61"/>
<!-- hair/head -->
<ellipse cx="124" cy="119" rx="32" ry="37" fill="#ce987b"/>
<path d="M91 117q-7-45 29-48 38-1 37 46-10-12-10-25-13 7-28 1-6 18-28 26" fill="#2b2630"/>
<path d="M110 121h2M136 121h2" stroke="#322832" stroke-width="3.5" stroke-linecap="round"/>
<path d="M120 137q8 5 15-1" fill="none" stroke="#915b51" stroke-width="2" stroke-linecap="round"/>
<!-- hands + laptop -->
<path d="M74 215q7 10 24 6l26-11-4-13-22 7-12-4" fill="#ce987b"/>
<path d="M170 220q14 6 28-4l11-16-8-8-18 14-15 2" fill="#ce987b"/>
<g filter="url(#shadow)"><path d="M124 176h107l-15 55H139z" fill="#fdfcfd" stroke="#c8aab7" stroke-width="2"/><path d="M137 229h91l9 7H123z" fill="#e9d8df"/><circle cx="178" cy="200" r="7" fill="#ead4dc"/></g>
</g>
<!-- floating item cards -->
<g class="float" filter="url(#shadow)"><rect x="46" y="48" width="61" height="47" rx="12" fill="#fff" stroke="#efd5df"/><path d="M63 70h25v15H63z" fill="none" stroke="#880f32" stroke-width="2.5" stroke-linejoin="round"/><path d="M70 70v-6h11v6" fill="none" stroke="#880f32" stroke-width="2.5"/><circle cx="91" cy="61" r="9" fill="#a21745"/><path d="m87 61 3 3 5-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></g>
<g class="float2" filter="url(#shadow)"><rect x="321" y="217" width="75" height="60" rx="13" fill="#fff" stroke="#efd5df"/><path d="M337 241c0-9 9-15 15-9s-1 16-7 16h-5v12" fill="none" stroke="#90153c" stroke-width="3" stroke-linecap="round"/><circle cx="340" cy="266" r="3" fill="#90153c"/><path d="M369 238h14M369 247h11M369 256h13" stroke="#d3abb9" stroke-width="3" stroke-linecap="round"/></g>
<g class="pulse"><circle cx="304" cy="39" r="8" fill="#eed5df"/><path d="M304 35v8M300 39h8" stroke="#ac4c6c" stroke-width="1.5" stroke-linecap="round"/></g>
<!-- bottom line -->
<path d="M50 312h365" stroke="#d6abbc" stroke-width="1" opacity=".6"/>
</svg>